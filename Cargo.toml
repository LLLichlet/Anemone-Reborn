[package]
name = "anemone-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.32"
htmlescape = "0.3.1"
native-tls = "0.2.18"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
serenity = "0.12.5"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-native-tls = "0.3.1"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.89"
rusqlite = { version = "0.39.0", features = ["bundled"] }
base64 = "0.22.1"
tokio-util = "0.7"
tokio-stream = "0.1"

[lints.clippy]
correctness = "deny"
suspicious  = "warn"
complexity  = "warn"
perf        = "warn"
style       = "warn"
pedantic    = "warn"
